name: Read-only Mainnet validation

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-validation:
    name: Read-only public Mainnet RPC checks (Node 22)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:live
